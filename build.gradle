import groovy.json.*

def modInfo = new JsonSlurper().parse(file('mod.json'))

ext{
    modName = modInfo.name
    modDisplayName = modInfo.displayName.toString().replaceAll(/\s+/, '')
    modVersion = modInfo.version
    classPrefix = project.findProperty('classPrefix') ?: modDisplayName
}

buildscript{
    dependencies{
        classpath "com.github.Anuken.Arc:arc-core:$arcVersion"
        classpath "com.github.Anuken.Mindustry:core:$mindustryVersion"
        classpath "com.squareup:javapoet:$javapoetVersion"
    }

    repositories{
        mavenCentral()
        maven{ url = "https://raw.githubusercontent.com/Zelaux/MindustryRepo/master/repository" }
        maven{ url = "https://maven.xpdustry.com/mindustry" }
        maven{ url = "https://jitpack.io" }
    }
}

allprojects{
    apply plugin: 'java'
    apply plugin: 'maven-publish'

    version = rootProject.ext.modVersion

    ext{
        def localProp = new File(rootDir, 'local.properties')
        sdkRoot = System.getenv('ANDROID_HOME') ?: System.getenv('ANDROID_SDK_ROOT') ?: (localProp.exists() ? new Properties().tap{ load(localProp.newInputStream()) }.getProperty('sdk.dir') : null)
        assetsDir = project(':main').file('assets')
    }

    repositories{
        mavenCentral()
        maven{ url = "https://raw.githubusercontent.com/Zelaux/MindustryRepo/master/repository" }
        maven{ url = "https://maven.xpdustry.com/mindustry" }
        maven{ url = "https://jitpack.io" }
    }

    java{
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        withJavadocJar()
        withSourcesJar()
    }

    publishing.publications{
        create('maven', MavenPublication){ from components.java }
    }

    tasks.withType(JavaCompile).configureEach{
        options.incremental = true
        options.encoding = 'UTF-8'
        options.compilerArgs += [
            "-AmodName=${rootProject.ext.modName}",
            "-AclassPrefix=${rootProject.ext.classPrefix}",
            "-ArootDir=${rootDir.absolutePath}"
        ]
        options.fork = true
        options.forkOptions.jvmArgs += [
            '--add-opens=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED',
            '--add-opens=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED',
            '--add-opens=jdk.compiler/com.sun.tools.javac.model=ALL-UNNAMED',
            '--add-opens=jdk.compiler/com.sun.tools.javac.processing=ALL-UNNAMED',
            '--add-opens=jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED',
            '--add-opens=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED',
            '--add-opens=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED',
            '--add-opens=java.base/sun.reflect.annotation=ALL-UNNAMED'
        ]
    }

    tasks.withType(Javadoc).configureEach{
        options.addStringOption('Xdoclint:none', '-quiet')
        options.addStringOption('-release', '17')
    }

    project(':annotations').tasks.withType(Javadoc).configureEach{ enabled = false }
}

tasks.register('install', Copy){
    dependsOn ':main:deploy'
    from project(':main').tasks.named('deploy')
    into{
        def p = findProperty('mindustryPath') ?: "$projectDir/run"
        file(new File(file(p), "Mindustry.exe").exists() ? "$p/saves/mods" : "$p/mods")
    }
}

clean.doLast{ delete fileTree('main/assets/icons'){ include '*-icons.properties' } }

tasks.register('installClient'){
    def p = findProperty('mindustryPath') ?: "$projectDir/run"
    def dir = file(p)
    def isSteam = new File(dir, "Mindustry.exe").exists()
    def target = file(isSteam ? "$dir/Mindustry.exe" : "$dir/client-${mindustryVersion}.jar")
    outputs.file target

    doLast{
        if(isSteam || (target.exists() && target.length() > 0)) return
        target.parentFile.mkdirs()
        logger.lifecycle("> Downloading Mindustry ${mindustryVersion}...")
        URI.create("https://github.com/Anuken/Mindustry/releases/download/${mindustryVersion}/Mindustry.jar").toURL().withInputStream{ is ->
            target.withOutputStream{ os -> is.transferTo(os) }
        }
        logger.lifecycle("Installed to '${target.absolutePath}'.")
    }
}

tasks.register('runClient'){
    dependsOn 'installClient', 'install'
    doLast{
        def p = findProperty('mindustryPath') ?: "$projectDir/run"
        def dir = file(p)
        def isSteam = new File(dir, "Mindustry.exe").exists()
        def client = file(isSteam ? "$dir/Mindustry.exe" : "$dir/client-${mindustryVersion}.jar")
        def saves = file(isSteam ? "$dir/saves" : dir)

        logger.lifecycle("> Starting Mindustry.")
        def pb = new ProcessBuilder(isSteam ? [client.path] : ['java', '-jar', client.path, '-debug'])
            .directory(saves).inheritIO()
        pb.environment().put('MINDUSTRY_DATA_DIR', saves.path)
        pb.environment().put('DEVELOPMENT', 'true')
        pb.start().waitFor()
    }
}

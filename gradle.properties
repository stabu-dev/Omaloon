# Mindustry classpath version
mindustryVersion = v159.7
# Actual Mindustry hash that is used for fetching component classes
mindustryFetchVersion = v159.7
# Fallback Arc version, deviate from `mindustryVersion` if using a Bleeding Edge classpath version.
arcVersion = v159.7
# Android SDK version.
sdkVersion = 33
# Minimum Android API version.
sdkAPI = 21
# Javapoet classpath version, for class file generation.
javapoetVersion = 1.12.1

# Mod prefix for generated classes
# Leave empty to use 'displayName' value from mod.json
classPrefix = Ol
# Root path for your Mindustry client (e.g., Steam or local installation)
# Leave empty to use a standalone client inside this project
mindustryPath =
# For faster compile time in next builds.
org.gradle.daemon = true

## Hints
hint.omaloon-air = Unlike the [accent]Liquid Tube[], certain blocks with a greater fluid capacity can hold more fluid for the same amount of pressure.
hint.omaloon-drills = Certain blocks work better in extreme conditions. Like the [accent]Hammer Drill[] that works faster in near vacuum conditions. [#ffd2ae]Beware of explosions![]
hint.omaloon-press = Some blocks like the [accent]Composite Press[] don't share fluids, but they do share to other transportation blocks like the [accent]Liquid Tube[].
hint.omaloon-pump_chaining = Pumps can be stacked in series or in parallel. The former allows greater strength, the latter allows greater efficiency.
hint.omaloon-shelter = Shelters work with positive pressure, covering a larger area at higher pressures.


## distribution
block.omaloon-tube-conveyor.name = Tube Conveyor
block.omaloon-tube-conveyor.description = Moves items forward. Unable to access most buildings.
block.omaloon-tube-distributor.name = Tube Distributor
block.omaloon-tube-distributor.description = Distributes input items to 3 outputs equally. Does not accept items from one of it's sides.
block.omaloon-tube-junction.name = Tube Junction
block.omaloon-tube-junction.description = Acts as a bridge for two crossing tube conveyor belts.
block.omaloon-tube-bridge-conveyor.name = Tube Bridge.
block.omaloon-tube-bridge-conveyor.description = Moves items through most terrain.
block.omaloon-tube-sorter.name = Tube Sorter
block.omaloon-tube-sorter.description = Filters multiple items, moving them forwards if selected and sideways otherwise.
block.omaloon-tube-overflow-gate.name = Tube Overflow Gate
block.omaloon-tube-overflow-gate.description = Moves items forwards, but also sideways if the front is blocked.
block.omaloon-tube-underflow-gate.name = Tube Underflow Gate
block.omaloon-tube-underflow-gate.description = Moves items sideways, but also forwards if the sides are blocked.

block.omaloon-liquid-tube.name = Liquid Tube
block.omaloon-liquid-tube.description = Moves liquids.
block.omaloon-liquid-pump.name = Mechanical Pump
block.omaloon-liquid-pump.description = Moves liquids forward.
block.omaloon-liquid-outlet.name = Liquid Outlet
block.omaloon-liquid-outlet.description = Allows a single liquid to pass through itself.
block.omaloon-liquid-junction.name = Liquid Junction
block.omaloon-liquid-junction.description = Acts as a bridge for two crossing liquid tubes.
block.omaloon-liquid-bridge.name = Liquid Bridge
block.omaloon-liquid-bridge.description = Moves liquids through most terrain.

## crafting
block.omaloon-composite-press.name = Composite Press
block.omaloon-composite-press.description = Compresses Nickel and Cobalt into Composite.

## production
block.omaloon-hammer-drill.name = Hammer drill
block.omaloon-hammer-drill.description = When placed on ore, outputs items. Efficiency increases with decreasing pressure inside, reaching peak performance in near vacuum conditions.

## power
block.omaloon-wind-turbine.name = Wind Turbine
block.omaloon-wind-turbine.description = A standard vertical wind turbine. Requires substantial spacing between each-other to function.
block.omaloon-coal-generator.name = Coal Generator
block.omaloon-coal-generator.distribution = Generates power by burning coal.
block.omaloon-impulse-node.name = Impulse Node
block.omaloon-impulse-node.description = Transmits power to connected buildings. The node will receive power from or supply power to any adjacent blocks.

## defense
block.omaloon-small-shelter.name = Small Shelter
block.omaloon-small-shelter.description = Creates a force field that protects buildings and units inside from being damaged by bad weather conditions.

## sandbox
block.omaloon-pressure-source.name = Pressure Source
block.omaloon-pressure-source.description = Maintains a single Liquid Tube at a certain amount of fluid. Sandbox only.


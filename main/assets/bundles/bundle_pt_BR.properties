block.omaloon-hammer-drill.description = Quando colocada sobre um minério, produz itens. A eficiência aumenta conforme a pressão interna diminui, atingindo o pico de desempenho em valores próximos ao vácuo.

## power
block.omaloon-wind-turbine.name = Turbina Eólica
block.omaloon-wind-turbine.description = Fornece uma pequena quantidade de energia a partir do vento.

block.omaloon-coal-generator.name = Gerador de Carvão
block.omaloon-coal-generator.distribution = Gera energia queimando carvão.

block.omaloon-impulse-node.name = Nó de Impulso
block.omaloon-impulse-node.description = Transmite energia para construções conectadas. O nó receberá energia de ou fornecerá energia para qualquer bloco adjacente.


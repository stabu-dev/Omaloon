block.omaloon-repairer.name = Reparador
block.omaloon-repairer.description = Cura periodicamente blocos e unidades próximas.

block.omaloon-small-shelter.name = Abrigo Pequeno
block.omaloon-small-shelter.description = Cria um campo de força que protege construções e unidades internas de danos causados por climas extremos.

block.omaloon-composite-wall.name = Parede de Compósito
block.omaloon-composite-wall.description = Protege estruturas de projéteis inimigos.
block.omaloon-composite-wall-large.name = Parede de Compósito Grande
block.omaloon-composite-wall-large.description = Protege estruturas de projéteis inimigos.


## Hints
hint.omaloon-air = Diferente do \ueab2 [accent]Tubo de Fluido[], certos blocos com maior capacidade podem armazenar mais fluido na mesma pressão.
hint.omaloon-drills = Blocos que utilizam pressão atingem o pico de eficiência em valores extremos. A \ueaa8 [accent]Broca de Impacto[] se destaca em quase vácuo, enquanto outros blocos podem exigir alta pressão.
hint.omaloon-pump_chaining = Bombas podem ser empilhadas em série ou em paralelo. A primeira permite maior força, a segunda permite maior eficiência.
hint.omaloon-wind_turbines = \ueaab [accent]Turbinas Eólicas[] geram forte turbulência, danificando umas às outras se colocadas muito próximas. Para evitar destruição, o posicionamento é restrito a uma distância segura.
hint.omaloon-press = Alguns blocos, como a \ueaad [accent]Prensa de Compósitos[], não trocam fluido com vizinhos, interagindo apenas com blocos de transporte como o \ueab2 [accent]Tubo de Fluido[].
hint.omaloon-shelter = O \ueaa6 [accent]Abrigo Pequeno[] utiliza pressão positiva, aumentando seu alcance efetivo conforme a pressão aumenta.

## Sector

sector.omaloon-crater.name = A Cratera
sector.omaloon-crater.description = Uma cratera equatorial de tamanho médio, uma das muitas deixadas pelos fragmentos de Set. Um lugar calmo e discreto, livre de atividade inimiga e ideal para um primeiro pouso. Explore os recursos disponíveis e cuidado: o frio extremo traz clima perigoso.

tc.cobalt = :omaloon-cobalt: [#bbc7c9]Cobalto[] é um recurso central para a maior parte\nda tecnologia aqui. Mine-o para expandir sua automação.
tc.research-drill = Abra a :tree: árvore tecnológica.\nPesquise a :omaloon-hammer-drill: [accent]Broca de Impacto[].
tc.rotate-distributor = :omaloon-tube-distributor: [accent]Distribuidores de Tubo[] não podem aceitar itens\npelo lado marcado. Gire o bloco para ficar de costas\npara a :omaloon-hammer-drill: [accent]Broca de Impacto[].
tc.rotate-block = [accent]Gire o bloco para o lado oposto[]
tc.pump = Coloque uma :omaloon-liquid-pump: [accent]Bomba Mecânica[] virada\npara longe da :omaloon-hammer-drill: [accent]Broca de Impacto[] para\n energizá-la.
tc.nickel = :omaloon-nickel: [#699B87]Níquel[] é um recurso vital,\nnecessário para estruturas e tecnologias avançadas.
tc.build-shelters = Parece que uma tempestade de granizo massiva está vindo.\nPesquise o :omaloon-small-shelter: [accent]Abrigo Pequeno[]\ne cubra todas as suas construções contra o granizo.
tc.hail-timer = Tempestade de Granizo em {0}
tc.press = Enquanto a tempestade ruge, garanta que sua base esteja\nprotegida, então configure a produção de :omaloon-composite: [#485674]Compósito[].
tc.build-press = Construa uma :omaloon-composite-press: [accent]Prensa de Compósitos[].\n:omaloon-composite: [#485674]Compósito[] é essencial\npara escapar desta cratera e para progressão futura.
tc.core = É hora de partir. Melhore o Núcleo.

sector.omaloon-redeployment-path.name = Caminho de Redistribuição
sector.omaloon-redeployment-path.description = Deserto ventoso longe de crateras ou montanhas. Redistribuições regulares de grupos pequenos de unidades foram notados próximo. Cuidado com as violentas tempestades de areia.
rp.text = O próximo grupo de inimigos se aproxima! Pesquise defesas, e\nprepare sua base contra ataques e tempestades de areia.
rp.next-enemy-group = [lightgray]Próximo grupo de inimigos em {0}


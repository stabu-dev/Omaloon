# units
unit.omaloon-discovery.name = Descoberta
unit.omaloon-discovery.description = Veículo barato para a Cápsula de Pouso. Constrói estruturas.

unit.omaloon-walker.name = Walker
unit.omaloon-walker.description = Defende o núcleo Floe de inimigos e constrói estruturas usando drones.
unit.omaloon-combat-drone-alpha.name = Alfa
unit.omaloon-combat-drone-alpha.description = Dispara projéteis padrão em alvos inimigos. Controlado pelo Walker.
unit.omaloon-main-drone-mono.name = Mono
unit.omaloon-main-drone-mono.description = Constrói estruturas e minera minérios. Controlado pelo Walker.

unit.omaloon-collector.name = Coletor
unit.omaloon-collector.description = Dispara um projétil de artilharia que permanece no chão, causando dano a inimigos e curando aliados.
unit.omaloon-effort.name = Effort
unit.omaloon-effort.description = Causa danos a alvos na frente.
unit.omaloon-lumen.name = Lumen
unit.omaloon-lumen.description = Move-se em direção a alvos inimigos e se auto-destrói, espalhando os líquidos contidos em seu interior.

unit.omaloon-legionnaire.name = Legionário
unit.omaloon-legionnaire.description = Dispara projéteis padrão em alvos inimigos.
unit.omaloon-centurion.name = Centurião
unit.omaloon-centurion.description = Dispara pequenos projéteis de estilhaços em alvos inimigos.
unit.omaloon-praetorian.name = Pretoriano
unit.omaloon-praetorian.description = Dispara mísseis balísticos de fragmentação em alvos inimigos.

unit.omaloon-cilantro.name = Coentro
unit.omaloon-cilantro.description = Dispara projéteis carregados em alvos inimigos.
unit.omaloon-basil.name = Manjericão
unit.omaloon-basil.description = Dispara um jato contínuo de chamas em alvos inimigos.
unit.omaloon-sage.name = Sálvia
unit.omaloon-sage.description = Dispara salvas de projéteis carregados e artilharia que permanece no solo.


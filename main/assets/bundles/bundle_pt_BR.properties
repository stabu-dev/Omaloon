## distribution
block.omaloon-tube-conveyor.name = Transportador de Tubo
block.omaloon-tube-conveyor.description = Move itens para frente. Incapaz de acessar a maioria das construções.

block.omaloon-tube-distributor.name = Distribuidor de Tubo
block.omaloon-tube-distributor.description = Distribui itens de entrada para 3 saídas igualmente. Comumente usado para distribuir itens entre construções e transportadores de tubo. Não aceita itens por um dos lados.

block.omaloon-tube-junction.name = Junção de Tubo
block.omaloon-tube-junction.description = Atua como uma ponte para dois transportadores de tubo que se cruzam.

block.omaloon-tube-bridge-conveyor.name = Ponte de Tubo
block.omaloon-tube-bridge-conveyor.description = Transporta itens sobre terreno ou construções.

block.omaloon-tube-sorter.name = Classificador de Tubo
block.omaloon-tube-sorter.description = Filtra múltiplos itens, e se um item de entrada corresponder à seleção, ele passa para frente. Caso contrário, o item é enviado para a esquerda e direita.

block.omaloon-tube-overflow-gate.name = Portão de Transbordamento de Tubo
block.omaloon-tube-overflow-gate.description = Só envia itens para a esquerda e direita se o caminho frontal estiver bloqueado.

block.omaloon-tube-underflow-gate.name = Portão de Fluxo Inferior de Tubo
block.omaloon-tube-underflow-gate.description = O oposto de um portão de transbordamento. Envia para a frente se os caminhos da esquerda e direita estiverem bloqueados.

block.omaloon-liquid-tube.name = Tubo de Líquido
block.omaloon-liquid-tube.description = Move líquidos.

block.omaloon-liquid-pump.name = Bomba Mecânica
block.omaloon-liquid-pump.description = Move líquidos para frente.

block.omaloon-liquid-outlet.name = Saída de Líquido
block.omaloon-liquid-outlet.description = Permite que um único líquido passe através de si.

block.omaloon-liquid-junction.name = Junção de Líquido
block.omaloon-liquid-junction.description = Atua como uma ponte para dois tubos de líquido que se cruzam.

block.omaloon-liquid-bridge.name = Ponte de Líquido
block.omaloon-liquid-bridge.description = Transporta líquidos sobre terreno ou construções.


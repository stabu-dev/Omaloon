## storage
block.omaloon-landing-capsule.name = Landing Capsule
block.omaloon-landing-capsule.description = Cheap core of the base. Requires fuel for launch.
block.omaloon-core-floe.name = Core: Floe
block.omaloon-core-floe.description = Core of the base. Does not require fuel for launch.
block.omaloon-storage-container.name = Storage Container
block.omaloon-storage-container.description = Stores a small amount of items of each type. Expands storage when placed next to other containers. Contents can be retrieved by a tube distributor.

## distribution
block.omaloon-tube-conveyor.name = Tube Conveyor
block.omaloon-tube-conveyor.description = Moves items forward. Unable to access most buildings.

block.omaloon-tube-distributor.name = Tube Distributor
block.omaloon-tube-distributor.description = Distributes input items to 3 outputs equally. Commonly used to distribute items across buildings and tube conveyors. Does not accept items from one of the sides. Pulls items out of adjacent storages. Unloading can be filtered by placing a sorter next to it.

block.omaloon-tube-junction.name = Tube Junction
block.omaloon-tube-junction.description = Acts as a bridge for two crossing tube conveyors.

block.omaloon-tube-bridge-conveyor.name = Tube Bridge
block.omaloon-tube-bridge-conveyor.description = Transports items over terrain or buildings.

block.omaloon-tube-sorter.name = Tube Sorter
block.omaloon-tube-sorter.description = Filters multiple items, and if an input item matches the selection, it passes forward. Otherwise, the item is outputted to the left and right.

block.omaloon-tube-overflow-gate.name = Tube Overflow Gate
block.omaloon-tube-overflow-gate.description = Only outputs items to the left and right if the front path is blocked.

block.omaloon-tube-underflow-gate.name = Tube Underflow Gate
block.omaloon-tube-underflow-gate.description = Opposite of an overflow tube gate. Outputs to the front if the left and right paths are blocked.

block.omaloon-liquid-tube.name = Liquid Tube
block.omaloon-liquid-tube.description = Moves liquids.

block.omaloon-liquid-pump.name = Mechanical Pump
block.omaloon-liquid-pump.description = Pumps liquids and gases forward. Does not require power.

block.omaloon-liquid-junction.name = Liquid Junction
block.omaloon-liquid-junction.description = Acts as a bridge for two crossing liquid tubes.

block.omaloon-liquid-bridge.name = Liquid Bridge
block.omaloon-liquid-bridge.description = Transports liquids over terrain or buildings.

## crafting
block.omaloon-composite-press.name = Composite Press
block.omaloon-composite-press.description = Compresses nickel and cobalt into composite. Requires pressure.
block.omaloon-graphite-press.name = Graphite Press
block.omaloon-graphite-press.description = Compresses coal into graphite. Requires pressure.

## production
block.omaloon-hammer-drill.name = Hammer Drill
block.omaloon-hammer-drill.description = When placed on ore, outputs items. Requires low pressure.

## power
block.omaloon-wind-turbine.name = Wind Turbine
block.omaloon-wind-turbine.description = Provides a small amount of power from the wind.

block.omaloon-coal-generator.name = Coal Generator
block.omaloon-coal-generator.description = Generates power by burning coal.

block.omaloon-impulse-node.name = Impulse Node
block.omaloon-impulse-node.description = Transmits power to connected buildings. The node will receive power from or supply power to any adjacent blocks.

## defense
block.omaloon-repairer.name = Repairer
block.omaloon-repairer.description = Periodically heals nearby blocks and units.

block.omaloon-small-shelter.name = Small Shelter
block.omaloon-small-shelter.description = Creates a force field that protects buildings and units inside from being damaged by extreme weather.\nRequires pressure. Higher pressure increases its range.

block.omaloon-composite-wall.name = Composite Wall
block.omaloon-composite-wall.description = Protects structures from enemy projectiles.
block.omaloon-composite-wall-large.name = Large Composite Wall
block.omaloon-composite-wall-large.description = Protects structures from enemy projectiles.

## turrets
block.omaloon-apex.name = Apex
block.omaloon-apex.description = Fires bullets at enemies.

block.omaloon-convergence.name = Convergence
block.omaloon-convergence.description = Fires homing energy bullets at enemy aircraft.

## sandbox
block.omaloon-pressure-source.name = Pressure Source
block.omaloon-pressure-source.description = Infinitely outputs liquids at the set pressure. Sandbox only.

# units
unit.omaloon-discovery.name = Discovery
unit.omaloon-discovery.description = Cheap vessel for the Landing Capsule. Builds structures.

unit.omaloon-walker.name = Walker
unit.omaloon-walker.description = Defends the Floe core from enemies and builds structures using drones.
unit.omaloon-combat-drone-alpha.name = Alpha
unit.omaloon-combat-drone-alpha.description = Fires standard bullets at enemy targets. Controlled by Walker.
unit.omaloon-main-drone-mono.name = Mono
unit.omaloon-main-drone-mono.description = Builds structures and mines ores. Controlled by Walker.

unit.omaloon-collector.name = Collector
unit.omaloon-collector.description = Fires an artillery that lingers on the ground, damaging enemies and healing allies.
unit.omaloon-effort.name = Effort
unit.omaloon-effort.description = Scratches targets in front.
unit.omaloon-lumen.name = Lumen
unit.omaloon-lumen.description = Moves towards enemy targets and self-destructs, splashing the liquids contained within.
unit.omaloon-splinter.name = Splinter
unit.omaloon-splinter.description = Rams ground targets at high speed.

unit.omaloon-legionnaire.name = Legionnaire
unit.omaloon-legionnaire.description = Fires standard bullets at enemy targets.
unit.omaloon-centurion.name = Centurion
unit.omaloon-centurion.description = Fires small shrapnel bullets at enemy targets.
unit.omaloon-praetorian.name = Praetorian
unit.omaloon-praetorian.description = Fires missiles at enemy targets.

unit.omaloon-cilantro.name = Cilantro
unit.omaloon-cilantro.description = Fires charged bullets at enemy targets.
unit.omaloon-basil.name = Basil
unit.omaloon-basil.description = Fires a continuous jet of flame at enemy targets.
unit.omaloon-sage.name = Sage
unit.omaloon-sage.description = Fires salvos of charged bullets and artillery that lingers on the ground.


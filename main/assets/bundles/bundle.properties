## Hints
hint.omaloon-air = Unlike the \uEAB2 [accent]Liquid Tube[], certain blocks with higher capacity can store more fluid at the same pressure.
hint.omaloon-drills = Blocks utilizing pressure reach peak efficiency at extreme values. \uEAA8 [accent]Hammer Drill[] excels in near-vacuum, whereas other blocks may require high pressure.
hint.omaloon-pump_chaining = Pumps can be stacked in series or in parallel. The former allows greater strength, the latter allows greater efficiency.
hint.omaloon-wind_turbines = \uEAAB [accent]Wind Turbines[] generate strong turbulence, damaging each other if placed too close. To prevent destruction, placement is restricted to a safe distance.
hint.omaloon-press = Some blocks, like \uEAAD [accent]Composite Press[], do not exchange fluid with neighbors, interacting only with transportation blocks like the \uEAB2 [accent]Liquid Tube[].
hint.omaloon-shelter = \uEAA6 [accent]Small Shelter[] utilizes positive pressure, extending its effective range as pressure increases.

## Sector

sector.omaloon-the-crater.name = The Crater
sector.omaloon-the-crater.description = A medium-sized equatorial crater, one of many left by the fragments of Set. A quiet and inconspicuous place, free from enemy activity and ideal for a first landing. Explore available resources and beware: extreme cold brings hazardous weather.

tc.cobalt = :omaloon-cobalt: [#bbc7c9]Cobalt[] is a core resource for most\ntech here. Mine it to expand into automation.
tc.research-drill = Open the :tree: tech tree.\nResearch the :omaloon-hammer-drill: [accent]Hammer Drill[].
tc.rotate-distributor = :omaloon-tube-distributor: [accent]Tube Distributors[] cannot accept items\nfrom the marked side. Rotate the block to face\naway from the :omaloon-hammer-drill: [accent]Hammer Drill[].
tc.rotate-block = [accent]Rotate the block away[]
tc.pump = Place a :omaloon-liquid-pump: [accent]Mechanical Pump[] facing\naway from the :omaloon-hammer-drill: [accent]Hammer Drill[] to\n power it.
tc.nickel = :omaloon-nickel: [#699B87]Nickel[] is a vital resource,\nrequired for advanced structures and technology.
tc.build-shelters = Looks like a massive hailstorm is coming.\nResearch the :omaloon-small-shelter: [accent]Small Shelter[]\nand cover all your buildings from the hail.
tc.hail-timer = Hailstorm is coming in {0}
tc.press = While the hailstorm rages, ensure your base is\nprotected, then set up :omaloon-composite: [#485674]Composite[] production.
tc.build-press = Build a :omaloon-composite-press: [accent]Composite Press[].\n:omaloon-composite: [#485674]Composite[] is essential\nto escape this crater and for further progression.
tc.core = It is time to leave. Upgrade the Core.


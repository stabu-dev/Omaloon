## Hints
hint.omaloon-drills = \uEAA8 [accent]Hammer Drill[] only works under low pressure, whereas other blocks may require pressure pumped in.
hint.omaloon-pump_chaining = Pumps placed in a row add up their pressure. Pumps placed side by side move more air.
hint.omaloon-wind_turbines = \uEAAB [accent]Wind Turbines[] churn the surrounding air: placed too close, they damage each other. Placement is limited to a safe distance.
hint.omaloon-press_line = A line of \uEAAD [accent]Composite Presses[] merges into one, more efficient and convenient building.
hint.omaloon-press = Neighboring \uEAAD [accent]Composite Presses[] do not share air tanks: supply each one with its own \uEAAF [accent]Mechanical Pump[], or connect them with \uEAB2 [accent]Liquid Tubes[].
hint.omaloon-tubes = \uEAB9 [accent]Tube Conveyors[] can only move items between transport and storage blocks. Other buildings need a \uEAB8 [accent]Tube Distributor[] to load and unload items to conveyors.
hint.omaloon-dust_storm = \uEAA6 [accent]Small Shelters[] protect buildings from dust storms as well.
hint.omaloon-unloading = \uEAB8 [accent]Tube Distributor[] pulls items out of adjacent storage blocks, including the core. Put a \uEAB5 [accent]Tube Sorter[] next to it to unload only chosen items.

## Sector
sector.omaloon-crater.name = The Crater
sector.omaloon-crater.description = A medium-sized equatorial crater, one of many left by the fragments of Set. A quiet and inconspicuous place, free from enemy activity and ideal for a first landing. Explore available resources and beware: extreme cold brings hazardous weather.

tc.cobalt = :omaloon-cobalt: [#bbc7c9]Cobalt[] is the base of most tech on Glasmore.\nGather some to start automating.
tc.research-drill = Automate mining.\nResearch the :omaloon-hammer-drill: [accent]Hammer Drill[].
tc.drills = [lightgray]Deploying the first drills...[]
tc.rotate-distributor = :omaloon-tube-distributor: [accent]Tube Distributors[] load ore from drills onto tubes,\nbut cannot accept items from their marked side.\nRotate the block to face away from the :omaloon-hammer-drill: [accent]Hammer Drill[].
tc.rotate-block = [accent]Rotate the distributor away from the drill[]
tc.research-pump = Those drills require pressure management.\nResearch a :omaloon-liquid-pump: [accent]Mechanical Pump[].
tc.pump = :omaloon-liquid-pump: [accent]Mechanical Pump[] facing away from the :omaloon-hammer-drill: [accent]Hammer Drill[]\nwill lower the pressure inside, making it mine.
tc.expand = Expand your mining, placing more :omaloon-hammer-drill: [accent]Hammer Drills[]\nwith :omaloon-tube-distributor: [accent]Tube Distributors[] unloading them.
tc.link-core = Route your ore into the core.\n:omaloon-tube-conveyor: [accent]Tube Conveyors[] can unload straight into it.
tc.nickel = :omaloon-nickel: [#699B87]Nickel[] unlocks electronics and more advanced technology.\nMine some and deliver it to the core as well.
tc.build-shelters = Looks like a massive, long-lasting hailstorm is coming.\nResearch the :omaloon-small-shelter: [accent]Small Shelter[] to protect your buildings from the hail.
tc.shelter = Cover your base with :omaloon-small-shelter: [accent]Small Shelters[]:\ntheir field protects the buildings inside it from the hail.\nPower them with :omaloon-wind-turbine: [accent]Wind Turbines[] and pump air into them,\nmore pressure widens the field.
tc.hail-timer = [accent]Hailstorm arrives in [lightgray]{0}[]
tc.press = While the storm rages, research the :omaloon-composite-press: [accent]Composite Press[]\nand start producing :omaloon-composite: [#485674]Composite[].
tc.composite = :omaloon-composite: [#485674]Composite[] is your ticket out of the crater.\nKeep and expand your production.
tc.core = It is time to leave.\nUpgrade to :omaloon-core-floe: [accent]Core: Floe[].

sector.omaloon-redeployment-path.name = Redeployment Path
sector.omaloon-redeployment-path.description = Windy wasteland far from craters and mountains. Regular redeployments of small enemy unit groups have been noticed here. Beware of violent dust storms.
rp.enemies = Small enemy groups are regularly redeployed across this wasteland.\nPrepare your defenses: research the :omaloon-apex: [accent]Apex[] turret.\nWatch out for violent dust storms.
rp.scouts-timer = [accent]Enemy approaching in [lightgray]{0}[]
rp.air = The unit has reported your base's position. More attacks will follow soon,\nsome of them by air. :omaloon-convergence: [accent]Convergence[] will help against those aircraft.


plugins{
    id 'java-library'
}

def generated = layout.buildDirectory.dir("generated/sources/fetchComps/java/main").get().asFile

sourceSets.main.java.srcDirs = ['src/', generated]

dependencies{
    compileOnly "org.jetbrains:annotations:24.0.1"
    compileOnly "com.github.Anuken.Arc:arc-core:$arcVersion"
    compileOnly "com.github.Anuken.Mindustry:core:$mindustryVersion"
    compileOnly project(':annotations')
    annotationProcessor project(':annotations')
}

import arc.util.*

tasks.register('deploy', Jar){
    dependsOn configurations.runtimeClasspath, ':tools:proc'
    archiveFileName = "${rootProject.ext.modDisplayName}Desktop.jar"

    from sourceSets.main.output
    from configurations.runtimeClasspath.collect{ it.isDirectory() ? it : zipTree(it) }
    from(rootProject.ext.assetsDir){ exclude 'sprites/vanilla/**', '**/*.class' }
    from(rootDir){ include 'mod.json', 'icon.png' }
}

tasks.register('dex', Jar){
    dependsOn deploy
    archiveFileName = "${rootProject.ext.modDisplayName}.jar"
    inputs.file deploy.archiveFile
    outputs.file archiveFile

    doFirst{
        def sdk = rootProject.ext.sdkRoot
        if(!sdk || !file(sdk).exists()) throw new GradleException("No Android SDK found. Set ANDROID_HOME or sdk.dir in local.properties.")

        def d8 = fileTree("$sdk/build-tools").matching{
            include(OS.isWindows ? '**/d8.bat' : '**/d8')
            exclude '**/*.jar'
        }.files.sort().reverse().find()?.path ?: (OS.isWindows ? 'd8.bat' : 'd8')
        temporaryDir.mkdirs()
        def dexJar = file("$temporaryDir/Dexed.jar")
        if(!OS.isWindows) ['chmod', '+x', d8].execute().waitFor()
        def cmd = [d8, '--min-api', sdkAPI, '--output', dexJar.path, deploy.archiveFile.get().asFile.path, '--lib', "$sdk/platforms/android-$sdkVersion/android.jar"]
        (configurations.compileClasspath + configurations.runtimeClasspath).each{ cmd += ['--classpath', it.path] }

        if(OS.isWindows) cmd = ['cmd', '/c'] + cmd
        def p = cmd.execute(null, temporaryDir)
        p.waitForProcessOutput(System.out, System.err)
        if(p.exitValue() != 0) throw new GradleException("d8 failed with code ${p.exitValue()}")
    }

    from zipTree(deploy.archiveFile)
    from{ zipTree("$temporaryDir/Dexed.jar") }
}

tasks.register('fetchComps'){
    def pkg = rootProject.ext.modName.replace("-", "") + '/fetched'
    def outDir = file("$generated/$pkg")
    inputs.property "ver", mindustryFetchVersion
    outputs.dir outDir

    doLast{
        delete outDir
        def zip = file("$buildDir/tmp/mindustry-${mindustryFetchVersion}.zip")
        if(!zip.exists()){
            zip.parentFile.mkdirs()
            new URL("https://codeload.github.com/Anuken/Mindustry/zip/refs/tags/${mindustryFetchVersion}").withInputStream{ is ->
                zip.withOutputStream{ os -> is.transferTo(os) }
            }
        }

        copy{
            from zipTree(zip).matching{ include "**/core/src/mindustry/entities/comp/**" }
            into outDir
            eachFile{ it.path = it.name }
            includeEmptyDirs = false
        }

        outDir.listFiles()?.each{ File f ->
            if(f.name.endsWith('.java')){
                f.text = f.text
                    .replace('mindustry.entities.comp', pkg.replace('/', '.'))
                    .replace('mindustry.annotations.Annotations.*', rootProject.ext.modName + '.annotations.Annotations.*')
                    .replaceAll('@Component\\((base = true|.)+\\)\n*', '@EntityComponent(base = true, write = false)\n')
                    .replaceAll('@Component\n*', '@EntityComponent(write = false)\n')
                    .replaceAll('@BaseComponent\n*', '@EntityBaseComponent\n')
                    .replaceAll('@(CallSuper|Final|EntityDef\\(*.*\\)*)\n*', '')
                    .replaceAll('@MethodPriority\\(([^)]+)f\\)', '@MethodPriority($1)')
            }
        }
    }
}

tasks.withType(JavaCompile).configureEach{
    options.release = 17
    dependsOn 'fetchComps'
}

tasks.withType(Jar).configureEach{
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude rootProject.ext.modName + '/fetched/**', rootProject.ext.modName + '/entities/comp/**', rootProject.ext.modName + '/entities/merge/**', 'sprites/vanilla/**'
}